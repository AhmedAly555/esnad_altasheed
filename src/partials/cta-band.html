<section class="section section--gradient cta" aria-labelledby="cta-title">
  <div class="container">
    <div class="card card--glass cta__card" data-reveal>
      <div>
        <h2 id="cta-title" class="cta__title">{{ui.cta.title}}</h2>
        <p>{{ui.cta.text}}</p>
      </div>
      <div class="cta__actions">
        <a class="btn btn--gold" href="{{root}}{{ui.cta.primary.href}}">{{ui.cta.primary.label}}</a>
        <p class="cta__phone">{{ui.cta.phoneLabel}} <a class="ltr" href="tel:{{site.contact.phone.href}}">{{site.contact.phone.display}}</a></p>
      </div>
    </div>
  </div>
</section>
