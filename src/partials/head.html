<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="{{site.web.themeColor}}">
  <link rel="canonical" href="{{site.web.url}}{{path}}">
  <link rel="alternate" hreflang="ar" href="{{site.web.url}}{{path}}">
  <link rel="alternate" hreflang="x-default" href="{{site.web.url}}{{path}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{site.company.nameAr}}">
  <meta property="og:locale" content="{{site.web.locale}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{site.web.url}}{{path}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{site.web.ogImageAlt}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{ogImage}}">
  <link rel="icon" href="{{root}}assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="{{root}}assets/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{root}}assets/brand/apple-touch-icon.png">
  <link rel="preload" href="{{root}}assets/fonts/noto-kufi-arabic-arabic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{root}}assets/fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>document.documentElement.classList.add("js")</script>
  <link rel="stylesheet" href="{{root}}css/site.css">
  {{pageCss}}
  {{structuredData}}
